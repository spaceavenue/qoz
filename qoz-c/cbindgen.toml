language = "C"
header = """/* qoz.h - C bindings for libqoz, generated by cbindgen from qoz-capi/src/lib.rs.
 * Do not edit by hand - regenerate with:
 *   cbindgen --config cbindgen.toml --output include/qoz.h
 * run from the qoz-capi/ directory.
 */"""
include_guard = "QOZ_H"
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "doxy"
cpp_compat = true
usize_is_size_t = true

[export]
prefix = ""

[fn]
prefix = ""
args = "auto"

[parse]
parse_deps = false
